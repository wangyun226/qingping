name: Build QingPing APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"
      - name: Generate Project and Build APK
        run: |
          mkdir -p app/src/main/java/com/qingping/adblocker app/src/main/res/xml app/src/main/res/values
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "QingPing"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.qingping.adblocker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.qingping.adblocker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 100
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">清屏</string>
              <string name="a11y_desc">清屏：自动跳过开屏广告与拦截摇一摇误触跳转</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/a11y_config.xml
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/a11y_desc"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application android:label="清屏" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".QingPingA11yService" android:label="清屏-开屏跳过与防误触"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/a11y_config" />
                  </service>
                  <service android:name=".QingPingVpnService" android:label="清屏-本地DNS广告过滤"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:foregroundServiceType="specialUse" android:exported="false">
                      <intent-filter><action android:name="android.net.VpnService" /></intent-filter>
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true" android:directBootAware="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/qingping/adblocker/QingPingApp.kt
          package com.qingping.adblocker
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.*
          import android.content.*
          import android.graphics.*
          import android.net.*
          import android.os.*
          import android.provider.Settings
          import android.system.OsConstants
          import android.view.accessibility.*
          import android.widget.*
          import java.io.*
          import java.nio.ByteBuffer
          import java.util.concurrent.ConcurrentHashMap
          import java.util.regex.Pattern

          object StatsStore {
              private const val PREF = "qingping_stats"
              fun record(ctx: Context, pkg: String, type: String) {
                  val sp = ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                  val key = "$pkg|$type"
                  val apps = (sp.getStringSet("apps", emptySet()) ?: emptySet()).toMutableSet()
                  apps.add(pkg)
                  sp.edit().putInt(key, sp.getInt(key, 0) + 1).putStringSet("apps", apps).apply()
              }
              fun summaryText(ctx: Context): String {
                  val sp = ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                  val apps = sp.getStringSet("apps", emptySet()) ?: emptySet()
                  if (apps.isEmpty()) return "暂无拦截记录（开启上方双引擎后，打开其他 APP 将自动按应用统计）"
                  val pm = ctx.packageManager
                  return apps.map { pkg ->
                      val name = try { pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString() } catch (_: Exception) { pkg }
                      val s = sp.getInt("$pkg|SPLASH", 0)
                      val j = sp.getInt("$pkg|JUMP", 0)
                      val d = sp.getInt("$pkg|DNS", 0)
                      Triple(name, s + j + d, "• $name ($pkg)\n  共拦截 ${s+j+d} 次（开屏跳过 $s / 防误触 $j / DNS阻断 $d）")
                  }.sortedByDescending { it.second }.joinToString("\n\n") { it.third }
              }
          }

          class QingPingA11yService : AccessibilityService() {
              private val cooldown = ConcurrentHashMap<String, Long>()
              private val skipRegex = Pattern.compile("^(\\s*跳过\\s*|\\s*跳过广告\\s*|\\s*\\d+\\s*[sS秒]?\\s*跳过.*|.*跳过\\s*\\d+.*)$")
              private val sdkIds = listOf(":id/tt_splash_skip_btn", ":id/splash_container_skip", ":id/ksad_splash_circle_skip_view", ":id/beizi_ad_splash_skip")
              private val jumpWords = listOf("想要打开", "即将离开", "允许打开", "打开第三方应用")
              private val cancelWords = listOf("取消", "拒绝", "不允许", "留在")

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val pkg = event?.packageName?.toString() ?: return
                  if (pkg == packageName || pkg == "com.android.systemui" || pkg == "com.android.settings") return
                  val root = rootInActiveWindow ?: return
                  try {
                      val now = SystemClock.elapsedRealtime()
                      if (now - (cooldown["s_$pkg"] ?: 0L) > 1400L) {
                          for (id in sdkIds) {
                              val nodes = root.findAccessibilityNodeInfosByViewId("$pkg$id")
                              if (!nodes.isNullOrEmpty() && clickNode(nodes[0])) {
                                  cooldown["s_$pkg"] = now
                                  StatsStore.record(applicationContext, pkg, "SPLASH")
                                  return
                              }
                          }
                          val target = findSkip(root)
                          if (target != null && clickNode(target)) {
                              cooldown["s_$pkg"] = now
                              StatsStore.record(applicationContext, pkg, "SPLASH")
                              return
                          }
                      }
                      if (now - (cooldown["j_$pkg"] ?: 0L) > 1200L && jumpWords.any { !root.findAccessibilityNodeInfosByText(it).isNullOrEmpty() }) {
                          for (cw in cancelWords) {
                              val cn = root.findAccessibilityNodeInfosByText(cw)
                              if (!cn.isNullOrEmpty() && clickNode(cn[0])) {
                                  cooldown["j_$pkg"] = now
                                  StatsStore.record(applicationContext, pkg, "JUMP")
                                  return
                              }
                          }
                      }
                  } finally { root.recycle() }
              }

              private fun findSkip(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null || !n.isVisibleToUser) return null
                  val t = (n.text ?: n.contentDescription ?: "").toString()
                  if (t.length in 2..12 && skipRegex.matcher(t).matches()) {
                      val r = Rect(); n.getBoundsInScreen(r)
                      if (r.width() in 30..600 && r.height() in 20..260) return n
                  }
                  for (i in 0 until n.childCount) { findSkip(n.getChild(i))?.let { return it } }
                  return null
              }

              private fun clickNode(n: AccessibilityNodeInfo): Boolean {
                  var c: AccessibilityNodeInfo? = n
                  while (c != null) {
                      if (c.isClickable && c.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                      c = c.parent
                  }
                  val r = Rect(); n.getBoundsInScreen(r)
                  if (r.exactCenterX() <= 0f || r.exactCenterY() <= 0f) return false
                  val p = Path().apply { moveTo(r.exactCenterX(), r.exactCenterY()) }
                  return dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0L, 45L)).build(), null, null)
              }
              override fun onInterrupt() {}
          }

          class QingPingVpnService : VpnService() {
              private var pfd: ParcelFileDescriptor? = null
              @Volatile private var running = false
              private val adDomains = setOf("is.snssdk.com", "pangolin-sdk-toutiao.com", "ad.toutiao.com", "mi.gdt.qq.com", "v.gdt.qq.com", "open.e.kuaishou.com", "mobads.baidu.com", "sdk.beizi.biz")

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val cid = "qingping_guard"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel(cid, "清屏双引擎守护", NotificationManager.IMPORTANCE_LOW))
                  }
                  startForeground(1001, Notification.Builder(this, cid).setContentTitle("清屏双引擎运行中").setContentText("GKD无障碍 + AdGuard本地DNS过滤已激活").setSmallIcon(android.R.drawable.ic_lock_lock).setOngoing(true).build())
                  if (pfd == null) {
                      pfd = Builder().setSession("QingPing-DNS").setMtu(1500).addAddress("10.215.173.1", 30).addDnsServer("10.215.173.2").addRoute("10.215.173.2", 32).establish()
                      if (pfd != null) { running = true; Thread { loop(pfd!!) }.start() }
                  }
                  return START_STICKY
              }

              private fun loop(fd: ParcelFileDescriptor) {
                  val ins = FileInputStream(fd.fileDescriptor)
                  val buf = ByteArray(1500)
                  while (running) {
                      val len = try { ins.read(buf) } catch (_: Exception) { break }
                      if (len <= 28) continue
                      val ihl = (buf[0].toInt() and 0x0F) * 4
                      if ((buf[9].toInt() and 0xFF) != OsConstants.IPPROTO_UDP || len < ihl + 20) continue
                      val bb = ByteBuffer.wrap(buf, 0, len)
                      val dstPort = bb.getShort(ihl + 2).toInt() and 0xFFFF
                      if (dstPort != 53) continue
                      var pos = ihl + 20
                      val parts = mutableListOf<String>()
                      while (pos < len) {
                          val l = buf[pos].toInt() and 0xFF
                          if (l == 0) break
                          pos++
                          if (pos + l > len) break
                          parts.add(String(buf, pos, l, Charsets.US_ASCII).lowercase())
                          pos += l
                      }
                      val domain = parts.joinToString(".")
                      if (adDomains.any { domain == it || domain.endsWith(".$it") }) {
                          StatsStore.record(applicationContext, "DNS广告域名拦截", "DNS")
                      }
                  }
              }
              override fun onDestroy() { running = false; pfd?.close(); pfd = null; super.onDestroy() }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  if (VpnService.prepare(context) == null) {
                      val i = Intent(context, QingPingVpnService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(i) else context.startService(i)
                  }
              }
          }

          class MainActivity : Activity() {
              private lateinit var statsTv: TextView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#F8FAFC")) }
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 64, 48, 64) }
                  box.addView(TextView(this).apply { text = "清屏 (QingPing) v1.0.0"; textSize = 22f; setTypeface(null, Typeface.BOLD); setTextColor(Color.parseColor("#0F172A")) })
                  box.addView(TextView(this).apply { text = "GKD 无障碍开屏跳过/防误触 + AdGuard 本地 VPN/DNS 过滤"; textSize = 13f; setTextColor(Color.parseColor("#475569")); setPadding(0, 8, 0, 32) })
                  box.addView(Button(this).apply {
                      text = "1. 开启【清屏无障碍服务】(开屏跳过 & 防误触)"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  box.addView(Button(this).apply {
                      text = "2. 启动【本地 VPN + DNS 广告过滤引擎】"
                      setOnClickListener {
                          val prep = VpnService.prepare(this@MainActivity)
                          if (prep != null) startActivityForResult(prep, 100) else startVpn()
                      }
                  })
                  box.addView(Button(this).apply {
                      text = "3. 加入电池无限制白名单 (防杀后台与开机自启)"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                      }
                  })
                  box.addView(TextView(this).apply { text = "\n按应用 (Per-App) 拦截统计明细"; textSize = 17f; setTypeface(null, Typeface.BOLD); setPadding(0, 24, 0, 12) })
                  statsTv = TextView(this).apply { textSize = 14f; setTextColor(Color.parseColor("#334155")) }
                  box.addView(statsTv)
                  root.addView(box)
                  setContentView(root)
              }
              override fun onResume() { super.onResume(); statsTv.text = StatsStore.summaryText(this) }
              override fun onActivityResult(req: Int, res: Int, data: Intent?) { if (req == 100 && res == RESULT_OK) startVpn() }
              private fun startVpn() {
                  val i = Intent(this, QingPingVpnService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
                  Toast.makeText(this, "清屏本地 DNS 过滤引擎已启动", Toast.LENGTH_SHORT).show()
              }
          }
          EOF

          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: QingPing-APK
          path: app/build/outputs/apk/debug/*.apk
